<style>
  :root{
    --bg:#000; --panel:#0E0E0E; --panel2:#161616; --line:#242424;
    --ink:#FFF; --mut:#B0B0B0; --dim:#6F6F6F;
    --teal:#56EDD6; --teal-deep:#0F756D; --on-teal:#04211D;
    --red:#FF4D4D; --orange:#E85D3A;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#050505; font-family:Heebo,system-ui,sans-serif; color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:0}

  .device{position:relative; width:100%; max-width:412px; height:100vh; max-height:880px;
    background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:34px; box-shadow:0 30px 80px rgba(0,0,0,.7)}
  @media (max-width:480px){ .device{max-width:none; height:100vh; max-height:none; border:0; border-radius:0} }

  .topbar{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:16px 16px 10px; position:relative; z-index:5}
  .back{width:44px; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; transition:opacity .2s}
  .back[disabled]{opacity:.28; pointer-events:none}
  .prog{flex:1; display:flex; gap:5px}
  .seg{flex:1; height:4px; border-radius:99px; background:#1c1c1c; overflow:hidden}
  .seg i{display:block; height:100%; width:0; background:var(--teal); border-radius:99px; transition:width .4s ease}
  .seg.done i,.seg.cur i{width:100%}
  .stepn{flex:0 0 auto; font-size:11px; color:var(--dim); font-weight:800; min-width:26px; text-align:center}
  .lang{flex:0 0 auto; font-size:11px; font-weight:800; color:var(--teal); background:var(--panel);
    border:1px solid var(--line); border-radius:99px; padding:7px 11px; cursor:pointer; letter-spacing:.4px}

  .stage{flex:1; overflow:hidden; position:relative}
  .screen{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; padding:14px 22px 26px}
  .screen.in-fwd{animation:inFwd .36s cubic-bezier(.22,.61,.36,1) both}
  .screen.in-back{animation:inBack .36s cubic-bezier(.22,.61,.36,1) both}
  .screen.out-fwd{animation:outFwd .36s cubic-bezier(.22,.61,.36,1) both}
  .screen.out-back{animation:outBack .36s cubic-bezier(.22,.61,.36,1) both}
  @keyframes inFwd{from{transform:translateX(-100%);opacity:.4} to{transform:translateX(0);opacity:1}}
  @keyframes outFwd{from{transform:translateX(0);opacity:1} to{transform:translateX(100%);opacity:.2}}
  @keyframes inBack{from{transform:translateX(100%);opacity:.4} to{transform:translateX(0);opacity:1}}
  @keyframes outBack{from{transform:translateX(0);opacity:1} to{transform:translateX(-100%);opacity:.2}}
  html[dir=ltr] .screen.in-fwd{animation:inFwdL .36s cubic-bezier(.22,.61,.36,1) both}
  html[dir=ltr] .screen.out-fwd{animation:outFwdL .36s cubic-bezier(.22,.61,.36,1) both}
  html[dir=ltr] .screen.in-back{animation:inBackL .36s cubic-bezier(.22,.61,.36,1) both}
  html[dir=ltr] .screen.out-back{animation:outBackL .36s cubic-bezier(.22,.61,.36,1) both}
  @keyframes inFwdL{from{transform:translateX(100%);opacity:.4} to{transform:translateX(0);opacity:1}}
  @keyframes outFwdL{from{transform:translateX(0);opacity:1} to{transform:translateX(-100%);opacity:.2}}
  @keyframes inBackL{from{transform:translateX(-100%);opacity:.4} to{transform:translateX(0);opacity:1}}
  @keyframes outBackL{from{transform:translateX(0);opacity:1} to{transform:translateX(100%);opacity:.2}}

  .glow{position:absolute; top:-50px; left:50%; transform:translateX(-50%);
    width:280px; height:280px; background:radial-gradient(circle,rgba(86,237,214,.15),transparent 70%); pointer-events:none}
  .spacer{flex:1; min-height:8px}

  .lockup{display:block; height:40px; width:auto; margin:2px auto 0}
  .hero-mascot{width:118px; height:118px; margin:10px auto 14px;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(86,237,214,.22),transparent 68%)}
  .hero-mascot img{width:108px; height:108px; object-fit:contain}

  h2{font-size:23px; font-weight:800; margin-bottom:9px; text-align:center; line-height:1.22}
  .lead{color:var(--mut); font-size:14px; text-align:center; line-height:1.65; margin-bottom:18px}
  .lead b{color:var(--ink)}
  .prose{color:var(--mut); font-size:14px; text-align:start; line-height:1.85; margin-bottom:12px}
  .prose b{color:var(--ink)}
  .prose .em{color:var(--teal); font-weight:700}
  .byline{color:var(--mut); font-size:12px; text-align:center; margin-top:7px; font-weight:700}

  .flist{display:flex; flex-direction:column; gap:12px; margin:4px 0}
  .fitem{display:flex; gap:12px; align-items:flex-start; text-align:start}
  .fic{flex:0 0 36px; width:36px; height:36px; border-radius:11px; background:var(--panel2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px}
  .ftx{font-size:13px; line-height:1.5; color:var(--mut)}
  .ftx b{color:var(--ink); display:block; font-size:13.5px; margin-bottom:2px}
  .ftx a{color:var(--teal); text-decoration:underline; font-weight:700; cursor:pointer}

  /* security band */
  .secband{display:flex; gap:11px; align-items:flex-start; background:rgba(86,237,214,.07);
    border:1px solid var(--teal-deep); border-radius:14px; padding:13px 14px; margin:2px 0 16px; text-align:start}
  .secband .sic{flex:0 0 32px; width:32px; height:32px; border-radius:9px; background:rgba(86,237,214,.14);
    display:flex; align-items:center; justify-content:center; font-size:17px}
  .secband .stx{font-size:12.5px; line-height:1.55; color:var(--mut)}
  .secband .stx b{display:block; color:var(--teal); font-size:13.5px; margin-bottom:2px}
  .linkrow{text-align:center; margin:8px 0 2px}
  .linkrow a{color:var(--teal); font-size:12.5px; font-weight:700; text-decoration:underline; cursor:pointer}

  label{display:block; font-size:13px; color:var(--mut); font-weight:700; margin:14px 2px 6px}
  .inp{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; color:var(--ink); font-size:15.5px; font-family:inherit}
  .inp:focus{outline:none; border-color:var(--teal-deep)}
  .inp.bad{border-color:var(--red)}
  .seg-g{display:flex; gap:8px; margin-top:6px}
  .seg-g button{flex:1; padding:12px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel); color:var(--mut); font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer}
  .seg-g button.on{background:var(--teal); color:var(--on-teal); border-color:var(--teal)}

  .check{display:flex; gap:11px; align-items:flex-start; margin-top:16px; font-size:13px; color:var(--mut); line-height:1.5; text-align:start; cursor:pointer}
  .box{flex:0 0 24px; width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:var(--panel);
    color:var(--on-teal); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; margin-top:1px; transition:.2s}
  .check.on .box{background:var(--teal); border-color:var(--teal)}
  .check .box span{opacity:0; transition:.2s}
  .check.on .box span{opacity:1}
  .check b{color:var(--teal)}

  .ho-ico{width:78px; height:78px; margin:8px auto 16px; border-radius:22px;
    background:linear-gradient(135deg,#229ED9,#1c84b3); display:flex; align-items:center; justify-content:center; font-size:38px}
  .tg-peek{display:flex; gap:10px; align-items:center; background:#0c1418; border:1px solid #1a2832; border-radius:14px; padding:11px 12px; margin-bottom:6px}
  .peek-av{flex:0 0 32px; width:32px; height:32px; border-radius:50%; background:#6ff0dd;
    display:flex; align-items:center; justify-content:center; overflow:hidden}
  .peek-av img,.tg-av img{width:100%; height:100%; object-fit:contain; display:block}
  .peek-bub{font-size:13px; color:#cfe0e3; line-height:1.4}
  .how{font-size:12.5px; color:var(--mut); line-height:1.6; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px; margin-top:10px; text-align:start; display:none}
  .how.open{display:block; animation:fade .3s ease both}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .dl{display:block; text-align:center; margin-top:14px; color:var(--teal); font-size:13px; text-decoration:none; font-weight:700}
  .dl span{color:var(--dim); font-weight:400}

  /* connections / service library */
  .svc{display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line);
    border-radius:13px; padding:11px 13px; margin-bottom:9px}
  .svc .si{flex:0 0 36px; width:36px; height:36px; border-radius:10px; background:var(--panel2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center}
  .svc .sn{flex:1; text-align:start}
  .svc .sn b{display:block; font-size:13.5px}
  .svc .sn span{font-size:11.5px; color:var(--dim)}
  .pill{font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px; white-space:nowrap}
  .pill.on{background:rgba(86,237,214,.14); color:var(--teal); border:1px solid var(--teal-deep)}
  .pill.off{background:transparent; color:var(--mut); border:1px solid var(--line)}

  /* telegram chat */
  .tg{flex:1; background:#0c1418; border-radius:18px; padding:14px 12px; display:flex; flex-direction:column;
    background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px); background-size:18px 18px}
  .tg-top{display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid #1a2832; margin-bottom:14px}
  .tg-av{width:40px; height:40px; border-radius:50%; background:#6ff0dd;
    display:flex; align-items:center; justify-content:center; overflow:hidden}
  .tg-name{font-weight:700; font-size:15px}
  .tg-on{color:#56EDD6; font-size:11px}
  .bub{max-width:88%; background:#17242c; border-radius:14px 14px 14px 4px; padding:10px 13px;
    font-size:13.5px; line-height:1.6; color:#eaf2f4; margin-bottom:9px; animation:pop .34s ease both}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
  .bub .tm{display:block; font-size:10px; color:#5d7585; text-align:end; margin-top:4px}
  .bub.me{background:#244536; border-radius:14px 14px 4px 14px; margin-inline-start:auto; color:#dff5ea}
  .bub b{color:#fff}
  .bub .danger{color:#FF6b6b; font-weight:800}
  .bub.warn{background:#2a1c1c; border:1px solid #5a2b2b}
  .delbtn{display:inline-block; margin-top:8px; background:#FF4D4D; color:#1a0606; font-weight:800;
    padding:7px 14px; border-radius:9px; font-size:12px}
  .sysmsg{align-self:center; margin:2px auto 12px; background:rgba(255,255,255,.06); color:#8aa0ab;
    font-size:11px; padding:4px 12px; border-radius:11px; animation:pop .34s ease both}
  .tg-input{margin-top:auto; display:flex; gap:8px; align-items:center; background:#17242c; border-radius:20px; padding:11px 15px; color:#5d7585; font-size:13px}

  .foot{flex:0 0 auto; padding:12px 22px calc(18px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,#000 22%)}
  .cta{width:100%; padding:16px; border:0; border-radius:14px; background:var(--teal); color:var(--on-teal);
    font-size:16px; font-weight:800; font-family:inherit; cursor:pointer; transition:.15s; min-height:54px}
  .cta:active{transform:scale(.985)}
  .cta[disabled]{opacity:.32; pointer-events:none; background:var(--panel2); color:var(--dim); border:1px solid var(--line)}
  .cta.ghost{background:transparent; color:var(--teal); border:1px solid var(--teal-deep); margin-top:10px}
  .howlink{display:block; width:100%; margin:12px auto 0; background:none; border:0; color:var(--teal);
    font-family:inherit; font-size:13.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .note{color:var(--dim); font-size:11.5px; text-align:center; margin-top:12px; line-height:1.55}
  .note.inbody{margin-top:14px}

  /* sheet overlay (terms / nanoclaw explainer) */
  .sheet{position:absolute; inset:0; z-index:55; background:rgba(0,0,0,.82); backdrop-filter:blur(4px);
    display:none; flex-direction:column; justify-content:flex-end}
  .sheet.on{display:flex; animation:fade .25s ease both}
  .sheet-card{background:var(--panel); border:1px solid var(--line); border-radius:22px 22px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom)); max-height:82%; overflow-y:auto; animation:up .3s ease both}
  @keyframes up{from{transform:translateY(40px); opacity:.5} to{transform:translateY(0); opacity:1}}
  .sheet-card h3{font-size:18px; font-weight:800; margin-bottom:12px}
  .sheet-card p{font-size:13.5px; color:var(--mut); line-height:1.8; margin-bottom:10px; text-align:start}
  .sheet-card p b{color:var(--ink)}

  /* telegram switch overlay */
  .switch{position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.92); backdrop-filter:blur(4px);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:30px}
  .switch.on{display:flex; animation:fade .25s ease both}
  .switch .ho-ico{margin:0; animation:bob 1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
  .switch p{color:var(--mut); font-size:14px; line-height:1.6}
  .switch b{color:var(--ink)}
</style>
</head>

    <div class="topbar">

    <div class="stage" id="stage"></div>

    <div class="switch" id="switch"></div>
    <div class="foot" id="foot"></div>
  </div>

function svcRow(svg,name,desc,on){
  return `<div class="svc"><div class="si">${svg}</div><div class="sn"><b>${name}</b><span>${desc}</span></div>`+
    `<span class="pill ${on?'on':'off'}">${on?(L==='he'?'מחובר':'connected'):(L==='he'?'חברו':'connect')}</span></div>`;
}

function bubbles(arr){
  return arr.map(b=>{
    if(b[0]==='sys') return `<div class="sysmsg">${b[1]}</div>`;
    return `<div class="bub${b[0]==='me'?' me':''}">${b[1]}<span class="tm">${b[2]}</span></div>`;
  }).join('');
}

function validReg(){
  return reg.name.trim().length>=2 &&
    /^[\d+][\d\-\s()]{6,}$/.test(reg.phone.trim()) &&
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(reg.email.trim()) &&
    (reg.gender==='m'||reg.gender==='f') &&
    agree;
}
function refreshCta(){
  const c=document.getElementById('regCta');
  if(c) c.disabled = !validReg() || submitting;
}

function footHTML(t){
  switch(i){
    case 0: return `<button class="cta" onclick="go(1)">${t.s1_cta}</button><p class="note">${t.s1_note}</p><p class="byline">${t.s1_by}</p>`;
    case 1: return `<button class="cta" onclick="go(1)">${t.s2_cta}</button><p class="note">${t.s2_note}</p>`;
    case 2: return `<button class="cta" id="regCta" ${validReg()&&!submitting?'':'disabled'} onclick="submitReg()">${submitting?t.s3_cta_load:t.s3_cta}</button>`;
    case 3: return `<button class="cta" onclick="telegramOpen()">${t.s4_cta}</button><button class="cta ghost" onclick="go(1)">${t.s4_next}</button><button class="howlink" onclick="toggleHow()">${t.s4_how_btn}</button>`;
    case 4: return `<button class="cta" onclick="go(1)">${t.s5_cta}</button>`;
    case 5: return `<button class="cta ghost" onclick="restart()">${t.s6_cta}</button>`;
  }
}

function paintChrome(){
  const t=T[L];
  document.documentElement.lang=L;
  document.documentElement.dir = L==='he'?'rtl':'ltr';
  document.getElementById('lang').textContent = L==='he'?'EN':'עב';
  let p='';
  for(let k=0;k<N;k++) p+=`<div class="seg ${k<i?'done':''} ${k===i?'cur':''}"><i></i></div>`;
  document.getElementById('prog').innerHTML=p;
  document.getElementById('stepn').textContent=`${i+1}/${N}`;
  document.getElementById('back').disabled = i===0 || submitting;
  document.getElementById('foot').innerHTML=footHTML(t);
}

function init(){
  history.replaceState({i:0},'');
  const stage=document.getElementById('stage');
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=screenHTML(T[L]);
  stage.appendChild(div);
  paintChrome();
}
function repaint(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  const div=document.createElement('div');
  div.className='screen';
  div.innerHTML=screenHTML(T[L]);
  stage.appendChild(div);
  paintChrome();
}
function transition(dir){
  if(animating) return;
  animating=true;
  const stage=document.getElementById('stage');
  const old=stage.querySelector('.screen');
  const nw=document.createElement('div');
  nw.className='screen '+(dir>0?'in-fwd':'in-back');
  nw.innerHTML=screenHTML(T[L]);
  if(old){ old.classList.remove('in-fwd','in-back'); old.classList.add(dir>0?'out-fwd':'out-back'); }
  stage.appendChild(nw);
  paintChrome();
  setTimeout(()=>{ if(old&&old.parentNode) old.parentNode.removeChild(old); animating=false; },380);
}
function go(d){
  const ni=i+d;
  if(ni<0||ni>=N||animating||submitting) return;
  if(d<0){ history.back(); return; }
  i=ni; howOpen=false; transition(d);
  history.pushState({i:i},'');
}
window.addEventListener('popstate',function(e){
  const ni=(e.state&&typeof e.state.i==='number')?e.state.i:0;
  if(ni===i) return;
  if(submitting){ history.pushState({i:i},''); return; }
  const d=ni>i?1:-1;
  i=ni; howOpen=false;
  if(animating){ repaint(); } else { transition(d); }
});

/* ---- registration submit: the real backend call ---- */
async function submitReg(){
  if(!validReg()||submitting||animating) return;
  submitting=true; paintChrome();
  const payload={ name:reg.name.trim(), phone:reg.phone.trim(), email:reg.email.trim(), gender:reg.gender, lang:L, src:SRC };
  try{
    const r=await fetch('/api/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await r.json().catch(()=>null);
    deepLink=(data&&data.deepLink)?data.deepLink:BOT_FALLBACK;
  }catch(e){
    deepLink=BOT_FALLBACK;
  }
  submitting=false;
  i=3; howOpen=false; transition(1);
  history.pushState({i:3},'');
}

/* ---- handoff: real Telegram deep link ---- */
function telegramOpen(){
  const t=T[L], sw=document.getElementById('switch');
  const url=deepLink||BOT_FALLBACK;
  sw.innerHTML=`<div class="ho-ico">✈️</div><h2>${t.sw_title}</h2><p>${t.sw_sub}</p>`;
  sw.classList.add('on');
  window.open(url,'_blank','noopener');
  setTimeout(()=>{ sw.classList.remove('on'); },1600);
}

function openSheet(which){
  const t=T[L], s=document.getElementById('sheet');
  const title = which==='terms'?t.sheet_terms_t:t.sheet_nano_t;
  const body  = (which==='terms'?t.sheet_terms:t.sheet_nano).map(p=>`<p>${p}</p>`).join('');
  s.innerHTML=`<div class="sheet-card"><h3>${title}</h3>${body}<button class="cta ghost" onclick="closeSheet()">${t.sheet_close}</button></div>`;
  s.classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

function restart(){ i=0; agree=false; howOpen=false; submitting=false; deepLink=''; reg.name=''; reg.phone=''; reg.email=''; reg.gender='m'; repaint(); history.pushState({i:0},''); }
function setGender(g){ reg.gender=g; repaint(); }
function toggleAgree(){ agree=!agree; repaint(); }
function toggleHow(){ howOpen=!howOpen; repaint(); }
function setLang(l){ L=l; repaint(); }
function toggleLang(){ L=(L==='he'?'en':'he'); repaint(); }

init();
